    attacker_ips: ["205.174.165.73"]
    nat_aliases: ["205.174.165.80", "172.16.0.1"]
    victim_ips: ["192.168.10.8"]

  # The official CIC page also lists a lateral Nmap step from 192.168.10.8 to
  # the whole LAN (15:04-15:45). CIC's CSV labels those flows BENIGN and the
  # paper's Table VII Infiltration graph has only 1,764 edges, so the lateral
  # step is intentionally excluded from the primary label (documented in QA).

